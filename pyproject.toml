[project]
name = "mojo-opensimplex"
version = "0.1.0"
description = "OpenSimplex noise kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "opensimplex", "noise", "procedural-generation"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "opensimplex==0.4.5.1"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-opensimplex"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
